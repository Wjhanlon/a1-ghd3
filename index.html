        "#4d004b",
      ];

      const background = d3
        .select("body")
        .insert("svg", ":first-child")
        .attr("id", "background")
        .attr("viewBox", "0 0 1920 1080")
        .attr("preserveAspectRatio", "none");

      //generate random points, so the background is different every time
      const points = [];
      for (let i = 0; i < 250; i++) {
        points.push([Math.random() * 1920, Math.random() * 1080]);
      }

      // code used from the d3-voronoi example and the idea got from https://observablehq.com/@d3/voronoi-labels
      const delaunay = d3.Delaunay.from(points);
      const voronoi = delaunay.voronoi([0, 0, 1920, 1080]);

      //fills it all in with colors and renders them
      background
        .selectAll("path")
        .data(points)
        .join("path")
        .attr("d", function (d, i) {
          return voronoi.renderCell(i);
        })
        .attr("fill", function () {
          return colors[Math.floor(Math.random() * colors.length)];
        })
        .attr("stroke", "#555")
        .attr("stroke-width", 2);

      const dispatch = d3.dispatch("select");

      // Add an SVG

      const picker = d3
        .select("#container")
        .append("svg")
        .attr("width", 400)
        .attr("height", 100)
        .style("border", "2px solid black");

      // Add Rectangles
      picker
        .append("rect")
        .datum("square")
        .attr("class", "shape")
        .attr("x", 10)
        .attr("y", 10)
        .attr("width", 80)
        .attr("height", 80)
        .attr("fill", "red");
      // Add Circles

      picker
        .append("circle")
        .datum("circle")
        .attr("class", "shape")
        .attr("cx", 150)
        .attr("cy", 50)
        .attr("r", 40)
        .attr("fill", "green");

      // Add Lines

      picker
        .append("line")
        .datum("line")
        .attr("class", "shape")
        .attr("x1", 210)
        .attr("y1", 10)
        .attr("x2", 290)
        .attr("y2", 90)
        .attr("stroke", "goldenrod")
        .attr("stroke-width", 4);

      // Add Polygons

      picker
        .append("polygon")
        .datum("triangle")
        .attr("class", "shape")
        .attr("points", "350,10 390,90 310,90")
        .attr("fill", "blue");

      picker
        .selectAll(".shape")
        .style("cursor", "pointer")
        .on("click", (event, key) => dispatch.call("select", null, key));

      // shape animation

      const box = d3
        .select("#box")
        .append("svg")
        .attr("width", 300)
        .attr("height", 300)
        .style("border", "2px solid black");

      box
        .append("rect")
        .datum("square")
        .attr("x", 50)
        .attr("y", 50)
        .attr("width", 200)
        .attr("height", 200)
        .attr("fill", "red");

      box
        .append("circle")
        .datum("circle")
        .attr("cx", 150)
        .attr("cy", 150)
        .attr("r", 100)
        .attr("fill", "green");

      box
        .append("line")
        .datum("line")
        .attr("x1", 50)
        .attr("y1", 50)
        .attr("x2", 250)
        .attr("y2", 250)
        .attr("stroke", "goldenrod")
        .attr("stroke-width", 4);

      box
        .append("polygon")
        .datum("triangle")
        .attr("points", "150,50 250,250 50,250")
        .attr("fill", "blue");

      const bigShapes = box.selectAll("*");

      const scaleBy = (k) =>
        `translate(150,150) scale(${k}) translate(-150,-150)`;

      bigShapes.attr("transform", (d) => scaleBy(d === "square" ? 1 : 0));

      dispatch.on("select", (key) => {
        bigShapes
          .filter((d) => d !== key)
          .transition()
          .duration(300)
          .ease(d3.easeCubicIn)
          .attr("transform", scaleBy(0));

        bigShapes
          .filter((d) => d === key)
          .transition()
          .delay(100)
          .duration(600)
          .ease(d3.easeCubicInOut)
          .attr("transform", scaleBy(1));
      });
